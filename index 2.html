<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

<title>Logos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#272727;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#222}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"Inter","Segoe UI",Roboto,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
.i{width:22px;height:22px}
#root{height:100%}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.list,.main{min-width:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.main{position:fixed;inset:0;z-index:5;transform:translateX(100%);transition:.25s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app.chat .main{transform:none}
.nav{margin-top:auto;display:flex;border-top:1px solid var(--ln);padding:6px 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}.nav .on{color:#fff}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}.hd h1{font-size:26px;flex:1}
.sc{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}.row:active,.row.on{background:var(--s1)}
.b{flex:1;min-width:0}.n{font-weight:600}.sub{color:var(--mu);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:600;flex:none;background:linear-gradient(135deg,#444,#161616);color:#ddd}
.srch{margin:6px 16px 10px;background:var(--s2);border-radius:16px;padding:0 14px;height:44px;display:flex;align-items:center}.srch input{flex:1}
.btn{background:#f2f2f2;color:#000;border-radius:16px;height:46px;font-weight:600;padding:0 18px}
.sm{background:var(--s3);border-radius:12px;padding:6px 12px;font-size:13px}
.fld{display:block;margin:8px 16px;background:var(--s2);border-radius:14px;padding:10px 14px}.fld small{color:var(--mu);display:block;font-size:12px}.fld input,.fld textarea{width:100%;margin-top:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln)}.top .t{flex:1;min-width:0}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;background:var(--s2);border-radius:18px 18px 18px 6px;padding:8px 12px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--s3);border-radius:18px 18px 6px 18px}
.m time{font-size:11px;color:var(--mu);margin-left:8px;float:right;margin-top:6px}
.comp{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--ln);align-items:center}
.comp input{flex:1;background:var(--s2);border-radius:20px;height:42px;padding:0 16px}
.sp{filter:blur(6px);cursor:pointer;background:#ffffff1a;border-radius:6px;padding:0 2px;transition:.2s}.sp.show{filter:none}.ro .comp{display:none}
.empty{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mu)}
.login{height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;max-width:420px;margin:auto}
.login .fld{margin:0}.err{color:#f87171;font-size:13px;min-height:18px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#f2f2f2;color:#000;padding:8px 16px;border-radius:14px;z-index:30;font-weight:600;display:none}
.msgs{-webkit-overflow-scrolling:touch}
.m{border-radius:22px 22px 22px 8px;padding:9px 14px;transition:transform .2s}.m.me{border-radius:22px 22px 8px 22px}
.pop{animation:pop .24s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}}
.ph{display:block;width:240px;max-width:100%;border-radius:16px;margin-bottom:4px;cursor:zoom-in}
.rq{border-left:3px solid #fff;padding:3px 8px;margin-bottom:5px;font-size:12.5px;color:var(--mu);background:#ffffff0d;border-radius:8px;cursor:pointer}.rq b{color:#fff;display:block}.rq div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpl{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--ln);font-size:13px;animation:fi .2s}
.flash{animation:fl 1s}@keyframes fl{30%{background:#555}}
button,.row,.nav button{transition:transform .12s,background .2s,opacity .2s}button:active{transform:scale(.94)}
.main{transition:transform .34s cubic-bezier(.22,.8,.2,1)}.comp input{border-radius:22px}
.bn{height:130px;background:linear-gradient(135deg,#3a3a3a,#111) center/cover;position:relative;margin-bottom:54px}
.avw{position:absolute;left:16px;bottom:-46px;border:4px solid var(--bg);border-radius:50%;background:var(--bg)}
.ov{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top);animation:fi .2s}@keyframes fi{from{opacity:0}}
.imgov{position:fixed;inset:0;z-index:40;background:#000e;display:grid;place-items:center;animation:fi .2s}.imgov img{max-width:100%;max-height:100%}
html,body{position:fixed;inset:0;width:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
input,textarea{font-size:16px;-webkit-user-select:text;user-select:text}
.list{position:relative}.list .sc{padding-bottom:92px}
.nav{position:absolute;left:14px;right:14px;bottom:8px;margin:0;border:1px solid #ffffff14;border-radius:32px;background:#1c1c1ccc;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);padding:5px;z-index:4;box-shadow:0 8px 30px #0008}
.nav button{border-radius:26px;padding:7px 0;transition:background .25s,color .25s}.nav .on{background:#ffffff1f;color:#fff}
.mr{display:flex;align-items:flex-end;gap:8px}.mr.me{justify-content:flex-end}.mr .m{align-self:auto;max-width:calc(78% - 40px)}.mr.me .m{max-width:78%}
.mav{width:32px;flex:none}.mav.hid{visibility:hidden}.mr.me .mav{display:none}
.sr{position:relative;overflow:hidden;contain:paint}.sr .row{position:relative;background:var(--bg);transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
.acts{position:absolute;right:0;top:1px;bottom:1px;display:flex}.acts button{width:70px;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#fff;border-radius:0}
.acts .a1{background:#d97706}.acts .a2{background:#2563eb}.acts .a3{background:#dc2626}
.tabin{animation:tin .3s cubic-bezier(.2,.8,.2,1)}@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.dlg{position:fixed;inset:0;z-index:35;background:#0009;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.dlg>div{background:var(--s2);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:420px;animation:up .3s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(100%)}}
.dlg .b2{display:block;width:100%;padding:14px;border-radius:16px;margin-top:8px;font-weight:600}
.lc{display:flex;flex-direction:column;flex:1;min-height:0}.list .sc{padding-bottom:84px}
.nav{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(290px,calc(100% - 56px));margin:0;display:flex;padding:4px;border-radius:26px;background:#1a1a1ab8;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid #ffffff1c;box-shadow:0 10px 30px #000a,inset 0 1px 0 #ffffff12;z-index:4}
.nav .pl{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:22px;background:linear-gradient(180deg,#ffffff2b,#ffffff14);transition:transform .45s cubic-bezier(.34,1.4,.5,1)}
.nav button{position:relative;flex:1;padding:5px 0 4px;font-size:10px;gap:1px;border-radius:22px;background:none!important;transition:color .3s}.nav button .i{width:21px;height:21px;transition:fill-opacity .3s}
.nav .on{color:#fff}.nav .on .i{fill:currentColor;fill-opacity:.2}
.sr .acts{opacity:0;pointer-events:none;clip-path:inset(1px 0)}.sr.sw .acts{opacity:1;pointer-events:auto}.acts .i{width:24px;height:24px;stroke-width:2}
.tk{display:inline-block;vertical-align:-3px;margin-left:2px;line-height:0}
.row:active{background:var(--s1)}
@media(min-width:900px){#app{grid-template-columns:380px minmax(0,1fr)}.list{border-right:1px solid var(--ln)}.main{position:static;transform:none!important;padding:0}.nav{order:-1;position:relative;left:auto;bottom:auto;transform:none;width:auto;margin:8px 12px}.list .sc{padding-bottom:12px}.bk{display:none}.empty.on{display:flex}}

/* ---- v8 ---- */
.main{will-change:transform}.row{transition:background .2s,transform .28s cubic-bezier(.2,.8,.2,1)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}.sub.ac{color:#6cb6ff}
.bd{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#f2f2f2;color:#000;font-size:12px;font-weight:700;display:grid;place-items:center;animation:pop .3s}.bd.mt{background:#555;color:#ddd}
.dsp{display:flex;justify-content:center;margin:8px 0 4px}.dsp span{background:#ffffff14;color:var(--mu);font-size:12px;padding:3px 11px;border-radius:12px}
.m{-webkit-touch-callout:none}.tp{color:#6cb6ff!important}
.dn{position:absolute;right:14px;bottom:78px;width:40px;height:40px;border-radius:50%;background:#2a2a2ae6;border:1px solid #ffffff1c;display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:.22s;z-index:3}.dn.on{opacity:1;transform:none;pointer-events:auto}
.snd{background:#f2f2f2;color:#000;border-radius:50%;opacity:.35;transform:scale(.88);transition:.22s}.comp.has .snd{opacity:1;transform:none}
.mi{display:flex!important;align-items:center;gap:12px;background:var(--s3)}.mi.dg{color:#f87171}
.acts{transition:opacity .2s}
@media(max-width:899px){.nav{width:min(232px,calc(100% - 90px));bottom:14px;padding:3px;border-radius:24px;background:#18181bb0}.nav .pl{top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:20px;box-shadow:0 0 16px #ffffff14}.nav button{padding:4px 0 3px;font-size:9.5px;border-radius:20px}.nav button .i{width:19px;height:19px}.list .sc{padding-bottom:70px}}

/* ---- v10 ---- */
:root{--ac:#f2f2f2;--acx:#0a0a0a;--me:#f2f2f2;--mt:#0a0a0a;--tk:#0a0a0a;--fs:1}
html[data-theme=graph],.pvw[data-theme=graph]{--bg:#17181a;--s1:#1f2024;--s2:#27292e;--s3:#33363d;--ln:#2a2c31;--ac:#e8ecf4;--acx:#17181a;--me:#e8ecf4;--mt:#17181a;--tk:#17181a}
html[data-theme=ocean],.pvw[data-theme=ocean]{--bg:#0a111d;--s1:#111a2b;--s2:#172338;--s3:#1f3050;--ln:#1a2840;--ac:#4ea1ff;--acx:#fff;--me:linear-gradient(135deg,#3b95f0,#2468c8);--mt:#fff;--tk:#ffffffd9}

html[data-theme=dusk],.pvw[data-theme=dusk]{--bg:#110a14;--s1:#1a1120;--s2:#231729;--s3:#31203a;--ln:#2a1b32;--ac:#b57bff;--acx:#fff;--me:linear-gradient(135deg,#a45cf0,#6d3bc4);--mt:#fff;--tk:#ffffffd9}
.btn,.toast{background:var(--ac);color:var(--acx)}
.android #app,.android .main{height:var(--vh)}
/* чаты */
.top{background:var(--bg);box-shadow:0 1px 0 var(--ln)}.main.wp .msgs{background-image:radial-gradient(#ffffff0e 1.2px,transparent 1.4px);background-size:22px 22px}
.msgs{gap:7px;padding:12px 10px}.mr{gap:6px}.mr.c{margin-top:-5px}.mr.pop{animation:pop .28s cubic-bezier(.2,.9,.2,1.1)}
.mav{width:28px}.mr.me .mav{display:block}
.mr .m{max-width:calc(80% - 34px)}.mr.me .m{max-width:calc(80% - 34px)}
.m{font-size:calc(15.5px*var(--fs));border-radius:20px;padding:8px 13px;box-shadow:0 1px 1px #0003}
.m:not(.me):not(.f){border-top-left-radius:6px}.m:not(.me):not(.l){border-bottom-left-radius:6px}.m:not(.me).l{border-bottom-left-radius:5px}
.m.me{background:var(--me);color:var(--mt)}.m.me:not(.f){border-top-right-radius:6px}.m.me:not(.l){border-bottom-right-radius:6px}.m.me.l{border-bottom-right-radius:5px}
.m.me time{color:inherit;opacity:.55}.m.me .tk{color:var(--tk);opacity:1}.m.me .rq{border-left-color:var(--mt);background:#00000014;color:var(--mt)}.m.me .rq b{color:var(--mt)}.m.me .sp{background:#0000001a}
.tk svg{width:17px;height:17px}
.tpr{display:flex;align-items:flex-end;gap:6px;animation:pop .26s cubic-bezier(.2,.9,.2,1.1)}.tpr .m{padding:13px 15px;border-radius:20px 20px 20px 5px;background:var(--s2)}
.dt{display:inline-flex;gap:3px;margin-left:3px;vertical-align:middle}.dt i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:bn 1.1s ease-in-out infinite}.dt i:nth-child(2){animation-delay:.16s}.dt i:nth-child(3){animation-delay:.32s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
#st{overflow:visible}.tp{color:var(--ac)!important}
.snd{background:var(--ac);color:var(--acx)}
/* список */
.sr .row::after{content:'';position:absolute;left:80px;right:0;bottom:0;height:.5px;background:var(--ln)}
.bd{background:var(--ac);color:var(--acx)}.sub.ac{color:var(--tx)}
.list .sc{padding-bottom:96px!important}
/* таббар как в TG */
#tb{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;z-index:4}
.tbp,.tbs{background:#1b1b1db8;-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);border:1px solid #ffffff1f;box-shadow:0 10px 32px #000a,inset 0 1px 0 #ffffff14}
.tbp{position:relative;flex:1;display:flex;height:58px;padding:4px;border-radius:30px}
.tbl{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:26px;background:linear-gradient(180deg,#ffffff30,#ffffff18);transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .25s}
.tbp button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:26px;color:#b4b4ba;font-size:10.5px;font-weight:600;background:none!important;transition:color .3s,transform .15s}
.tbp .i,.tbs .i{width:24px;height:24px;transition:fill-opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}.tbp .on{color:#fff}.tbp .on .i{fill:currentColor;fill-opacity:.18;transform:scale(1.08)}
.tbb{position:absolute;top:3px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ac);color:var(--acx);font-size:11px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}.tbb.s{transform:none}
.tbs{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;color:#d6d6da;transition:background .3s,color .3s,transform .15s}.tbs.on{background:#ffffff30;color:#fff}.tbs:active,.tbp button:active{transform:scale(.92)}
/* настройки и плашки */
.pc{margin:6px 16px 14px;border-radius:24px;overflow:hidden;background:var(--s1);cursor:pointer}.pcb{height:84px;background:linear-gradient(135deg,#3a3a3a,#111) center/cover}
.pci{display:flex;align-items:flex-end;gap:12px;padding:0 14px 14px;margin-top:-30px}.pci .av{border:3px solid var(--s1)}.pn{font-size:18px;font-weight:700}
.grp{margin:0 16px 14px;background:var(--s1);border-radius:20px;overflow:hidden}.it{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative;transition:background .2s}.it+.it::before{content:'';position:absolute;left:54px;right:0;top:0;height:.5px;background:var(--ln)}.it:active{background:var(--s2)}
.it .ib2{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--s3)}.it .ib2 .i{width:18px;height:18px}.it>span:nth-child(2){flex:1}.it>.i{width:18px;height:18px;color:var(--mu)}.it.rd{color:#f87171}
.sh{position:fixed;inset:0;z-index:50;background:#0000;transition:background .3s;display:flex;align-items:flex-end;justify-content:center}.sh.in{background:#000a}
.shb{width:100%;max-width:480px;max-height:90%;background:var(--s1);border-radius:28px 28px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .42s cubic-bezier(.22,.95,.25,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px #0008}.sh.in .shb{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#ffffff33;margin:4px auto 10px;flex:none}.sht{font-size:18px;font-weight:700;text-align:center;margin-bottom:10px;flex:none}.shc{overflow:auto;-webkit-overflow-scrolling:touch}.shc .fld{margin:8px 0}
.pl2{margin:12px 2px 6px;color:var(--mu);font-size:13px}.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13.5px;color:var(--mu);transition:background .25s,color .25s}.seg .on{background:var(--s3);color:var(--tx)}
.thg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tl{border-radius:16px;padding:8px;background:var(--s2);text-align:center;font-size:12.5px;border:2px solid transparent;transition:border-color .2s,transform .15s;cursor:pointer}.tl:active{transform:scale(.95)}.tl.on{border-color:var(--ac)}.tl i{display:block;height:44px;border-radius:10px;margin-bottom:6px;position:relative}.tl i b{position:absolute;right:7px;bottom:7px;width:24px;height:12px;border-radius:7px}
.tgr{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;cursor:pointer}.tgs{width:48px;height:29px;border-radius:15px;background:var(--s3);position:relative;transition:background .25s}.tgs::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}.tgs.on{background:var(--ac)}.tgs.on::after{transform:translateX(19px);background:var(--acx)}

/* ---- v11 ---- */
:root{--ease:cubic-bezier(.22,.9,.25,1);--ac2:#8a94a8;--gl:#1b1b1db8;--gb:#ffffff1f;--nm:#b4b4ba;--nt:#fff;--pl:linear-gradient(180deg,#ffffff30,#ffffff18);--pl2:#ffffff30;--hl:#ffffff14;--hl2:#ffffff33;--wcc:#ffffff10;--br:20px}
html[data-theme=graph],.pvw[data-theme=graph]{--ac2:#7aa2ff}

html[data-theme=forest],.pvw[data-theme=forest]{--ac2:#d4e157}
html[data-theme=dusk],.pvw[data-theme=dusk]{--ac2:#ff7ab0}
html[data-theme=rose],.pvw[data-theme=rose]{--bg:#140a0f;--s1:#1d1016;--s2:#28151e;--s3:#3a1f2d;--ln:#2e1823;--ac:#ff7ab0;--acx:#2a0a17;--ac2:#ffb36b;--me:linear-gradient(135deg,#ff6fa5,#d93c7d);--mt:#fff;--tk:#ffffffd9}

/* стекло и светлые темы через переменные */

.sub.ac{color:var(--tx)}

/* плавность */
html{scroll-behavior:auto}
.list{position:relative;transition:transform .46s var(--ease)}
.list::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dm,0);pointer-events:none;transition:opacity .46s var(--ease);z-index:9}

.main{transition:transform .46s var(--ease),box-shadow .46s;box-shadow:none}

.dlg.out{animation:fo .22s forwards}.dlg.out>div{animation:dn2 .24s forwards}@keyframes fo{to{opacity:0}}@keyframes dn2{to{transform:translateY(100%)}}
.sh{transition:background .38s}
html.nofx *,html.nofx *::before,html.nofx *::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}

/* композер и запись */
.comp{position:relative;background:var(--bg)}
.comp>label.ib{border-radius:50%;flex:none}.comp #in{min-width:0}

/* клавиатура: поле ввода всегда над клавиатурой, особенно на Android */
.kbx .main{padding-bottom:var(--kbx,0px)}
.kbx .sh{padding-bottom:var(--kbx,0px)}
.kbx #root>.login{padding-bottom:calc(24px + var(--kbx,0px));overflow:auto}
.android.kb .main{padding-bottom:calc(var(--kbe,16px) + var(--kbx,0px))}
.android.kb .comp{padding-bottom:10px}
.comp{will-change:auto}.msgs{overflow-anchor:none}
.m a{color:inherit;text-decoration:underline;text-underline-offset:2px;word-break:break-all}

/* превью тем: фон, твои сообщения и сообщения собеседника */
.pvw{--tx:#f2f2f2;--mu:#8a8a8a;--hl:#ffffff14;position:relative;height:78px;border-radius:12px;background:var(--bg);padding:15px 7px 6px;display:flex;flex-direction:column;gap:4px;overflow:hidden;margin-bottom:6px;color:var(--tx);border:1px solid var(--ln,#ffffff14);text-align:left}
.pvw::before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--hl) 1px,transparent 1.3px);background-size:9px 9px}
.pvw::after{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:var(--s1);box-shadow:0 1px 0 var(--ln)}
.pvw u{display:block;position:relative;text-decoration:none;height:15px;width:60%;border-radius:8px 8px 8px 3px;background:var(--s2);color:var(--tx);z-index:1}
.pvw u::after{content:'';position:absolute;left:6px;top:5.5px;height:4px;width:55%;border-radius:2px;background:currentColor;opacity:.5}
.pvw u.m{align-self:flex-end;width:52%;border-radius:8px 8px 3px 8px;background:var(--me);color:var(--mt)}
.pvw u.s{width:38%}
.pvw[data-theme=mono]{--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#272727;--ln:#222;--ac:#f2f2f2;--acx:#0a0a0a;--me:#f2f2f2;--mt:#0a0a0a;--tk:#0a0a0a}
.tl{padding:6px 6px 8px}
.cvb{display:flex;gap:12px;align-items:center;margin-bottom:12px}.cvb .tl{width:108px;flex:none}.cvc{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.hue{-webkit-appearance:none;appearance:none;width:100%;height:26px;border-radius:13px;background:linear-gradient(90deg,hsl(0 90% 60%),hsl(60 90% 60%),hsl(120 90% 55%),hsl(180 90% 55%),hsl(240 90% 65%),hsl(300 90% 60%),hsl(360 90% 60%));touch-action:pan-x}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #0007;box-shadow:0 2px 8px #0006}
.hue::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0007}
.vol{width:100%;accent-color:var(--ac);height:30px;touch-action:pan-x}
.thg .gt{grid-column:1/-1;margin:8px 2px 0}
.sng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.snb{padding:11px 4px;border-radius:12px;background:var(--s2);font-size:12.5px;border:2px solid transparent;color:var(--tx);transition:border-color .2s,transform .15s}.snb.on{border-color:var(--ac)}

/* звонки */
.cl{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 70px) 24px calc(env(safe-area-inset-bottom) + 44px);background:var(--bg);color:var(--tx);animation:fi .3s;overflow:hidden;transition:opacity .3s,transform .3s}
.cl.bye{opacity:0;transform:scale(1.04)}
.clbg{position:absolute;inset:0;background:radial-gradient(80% 46% at 50% 10%,var(--ac),transparent 70%),radial-gradient(70% 40% at 50% 112%,var(--ac2),transparent 70%);opacity:.3}
.cltop{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.clav{position:relative;width:132px;height:132px;margin-bottom:12px}
.clav .av{width:132px;height:132px;font-size:54px}
.clav::before,.clav::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:cring 2.4s ease-out infinite}.clav::after{animation-delay:1.2s}
@keyframes cring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.cl.on .clav::before,.cl.on .clav::after{animation:none}
.cln{font-size:27px;font-weight:700}.cls{color:var(--mu);font-variant-numeric:tabular-nums;font-size:16px}
.clb{position:relative;z-index:2;display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.clk{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mu)}
.clk button{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--tx)}.clk button .i{width:28px;height:28px}
.clk .red{background:#ef3f55;color:#fff}.clk .grn{background:#22c55e;color:#fff}.clk .tog.on{background:var(--tx);color:var(--bg)}
.cl #rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
.cl.vid.on #rv{display:block}
.cl #lv{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);width:98px;height:138px;object-fit:cover;border-radius:16px;background:#111;display:none;z-index:3;transform:scaleX(-1);box-shadow:0 6px 22px #0009}
.cl.vid.on #lv{display:block}
.cl.vid.on{color:#fff}.cl.vid.on .clbg,.cl.vid.on .clav{display:none}
.cl.vid.on .cltop{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;align-items:flex-start;text-align:left;text-shadow:0 1px 10px #000c}
.cl.vid.on .cls,.cl.vid.on .clk{color:#ffffffcc}
.cl.vid.on .cln{font-size:20px}
.cl.vid.on .clb{margin-top:auto}

/* ---- v13: стикеры ---- */
.stw{min-height:280px}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;max-height:48vh;overflow:auto;padding:6px 2px 2px}
.stin{animation:tiu .3s var(--ease)}
.stc{position:relative;aspect-ratio:1;border-radius:16px;background:var(--s2);display:grid;place-items:center;padding:6px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.stc:active{transform:scale(.9)}
.stc svg,.stc img{width:100%;height:100%;object-fit:contain;display:block}
.stn{color:var(--mu);font-size:12px;border:2px dashed var(--ln);background:none;align-content:center;gap:2px}.stn .i{width:26px;height:26px;margin:0 auto}.stn span{display:block}
.stx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#ef3f55;color:#fff;display:grid;place-items:center;z-index:2}.stx .i{width:14px;height:14px}
.stk{width:150px;height:150px}.stk svg,.stk img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px #0005)}
.m.stm{background:none!important;box-shadow:none!important;padding:0!important;border-radius:0!important}

.mr.pop .stk>*{animation:stpop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes stpop{from{transform:scale(.3) rotate(-14deg);opacity:0}}
.m.bge{background:none!important;box-shadow:none!important;font-size:48px;line-height:1.15;padding:0 2px!important}
.m.bge time,.m.me.bge time{color:var(--mu)!important;opacity:1}.m.bge .tk,.m.me.bge .tk{color:var(--mu)!important}
.stb{border-radius:50%;background:var(--s2);flex:none;width:38px;overflow:hidden;transition:width .2s,opacity .15s,margin .2s}
.comp.has .stb{width:0;opacity:0;margin-left:-8px;pointer-events:none}
.dlg.top{z-index:80}

<style>
/* ===== v16: компактно, современно ===== */
*{-webkit-tap-highlight-color:transparent}button,.row,.it,.tl,.snb{touch-action:manipulation}
.pvw::before{display:none!important}
.pvw{height:60px;padding:13px 6px 5px;gap:3px}.pvw u{height:13px}.pvw u.m{background:var(--me)!important}
.thg{gap:8px}.tl{padding:5px 5px 6px;border-radius:14px;font-size:12px}
.hd{padding:10px 16px 4px}.hd h1{font-size:28px}
.row{padding:7px 14px;gap:11px}.sr .row::after{left:76px}
.srch{padding:2px 14px 6px!important}
.sbar{background:none!important;border:0!important;box-shadow:none!important;margin:0!important;padding:2px 14px 8px!important;gap:12px}
.sty small{font-size:10.5px}
/* свайп чата */
.acts{top:0!important;bottom:0!important;padding:5px 8px 5px 0;gap:6px;align-items:stretch}
.acts button{width:60px!important;border-radius:18px!important;font-size:10.5px;font-weight:600}
.acts .i{width:22px!important;height:22px!important}
.sr:not(.sw) .acts{visibility:hidden}.sr.out .acts{display:none!important}.sr{contain:layout paint}
/* шторки */
.shb{padding:6px 14px calc(14px + env(safe-area-inset-bottom))!important;border-radius:26px 26px 0 0!important}
.sht{font-size:16px!important;margin-bottom:6px!important}.pl2{margin:9px 2px 4px!important;font-size:12px!important}
.tgr{padding:9px 2px!important}.tgs{width:44px;height:26px}.tgs::after{width:20px;height:20px}.tgs.on::after{transform:translateX(18px)}
.sng{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
.snb{padding:8px 2px!important;font-size:11.5px!important;border-radius:11px!important}
.seg button{padding:7px 4px!important;font-size:13px!important}
.fld input[type=date]{text-align:left;-webkit-appearance:none;min-height:22px;display:block}
.pfh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.pfh>div{display:flex;gap:8px;flex-wrap:wrap}
.pfg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pfg .fld{margin:0!important;padding:8px 12px;border-radius:14px}.pfg .w2{grid-column:1/-1}
/* создание группы / канала */
.gk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.gk button{display:grid;gap:2px;justify-items:start;text-align:left;padding:12px;border-radius:18px;background:var(--s2);border:2px solid transparent;transition:border-color .25s,background .25s,transform .2s}
.gk button.on{border-color:var(--ac);background:var(--s3)}.gk i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--s3);margin-bottom:4px}.gk button.on i{background:var(--ac);color:var(--acx)}
.gk b{font-size:15px}.gk small{color:var(--mu);font-size:11.5px}
.gnr{display:flex;gap:10px;align-items:center}.gnr .fld{margin:0!important}
.gav{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;background:var(--s3);transition:background .3s;box-shadow:inset 0 0 0 1px #ffffff1f}
.gsr{width:100%;height:42px;margin:10px 0 6px;border-radius:21px;background:var(--s2);padding:0 16px;border:1px solid var(--ln)}
.gch{display:flex;gap:6px;flex-wrap:wrap}.gch span{padding:4px 10px;border-radius:14px;background:var(--ac);color:var(--acx);font-size:12px;font-weight:600;animation:v14in .25s both}
.gpl{max-height:30vh!important}.gp{padding:6px 4px!important}
/* питомец */
.main>.pet{position:relative;z-index:2}
.pet{display:flex;align-items:center;gap:10px;margin:6px 10px 0;padding:4px 14px 4px 6px;border-radius:20px;background:var(--s1);border:1px solid var(--ln);cursor:pointer;flex:none;transition:transform .2s}.pet:active{transform:scale(.98)}
.pet.pnew{animation:pnew .7s cubic-bezier(.3,1.6,.5,1)}@keyframes pnew{40%{transform:scale(1.04);box-shadow:0 0 0 3px var(--ac)}}
.pav{width:58px;height:50px;flex:none;display:grid;place-items:end center}
.pimg{max-width:100%;max-height:100%;object-fit:contain;transform-origin:50% 100%;-webkit-user-drag:none;user-select:none;pointer-events:none}.pimg.dim{opacity:.55;filter:grayscale(.6)}
.pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.pi b{font-size:14px}.pi span{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pst{font-size:20px}
.pbar{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:3px}.pbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .8s cubic-bezier(.22,.95,.25,1)}.pbar.big{height:8px;margin:8px 0 4px}
.pa-breathe{animation:pbr 3.2s ease-in-out infinite}@keyframes pbr{50%{transform:scale(1.025,.972)}}
.pa-bounce{animation:pbo 1.6s ease-in-out infinite}@keyframes pbo{0%,100%{transform:none}40%{transform:translateY(-7%) scale(.98,1.03)}70%{transform:scale(1.03,.96)}}
.pa-sway{animation:psw 2.4s ease-in-out infinite}@keyframes psw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.pa-wobble{animation:pwo 3s ease-in-out infinite}@keyframes pwo{0%,40%,100%{transform:none}10%{transform:rotate(-3deg)}20%{transform:rotate(3deg)}30%{transform:rotate(-2deg)}}
.pa-pulse{animation:ppu 1.3s ease-in-out infinite}@keyframes ppu{0%,70%,100%{transform:none}14%{transform:scale(1.07)}28%{transform:none}42%{transform:scale(1.05)}}
.pa-shake{animation:psh 2s infinite}@keyframes psh{0%,60%,84%,100%{transform:none}64%{transform:translateX(-3%) rotate(-1deg)}68%{transform:translateX(3%) rotate(1deg)}72%{transform:translateX(-3%)}76%{transform:translateX(3%)}80%{transform:translateX(-1%)}}
.pa-droop{animation:pdr 4s ease-in-out infinite}@keyframes pdr{50%{transform:translateY(2%) scale(1.01,.97)}}

const PCOL=[['spark',1,'Искра'],['love',2,'Любовь'],['happy',3,'Кайф'],['rofl',4,'Рофл'],['chill',5,'Чилл'],['pon',6,'Пон'],['bell',7,'Звонок'],['tilt',9,'Тильт'],['genius',10,'Гений'],['cringe',12,'Кринж'],['flash',14,'Флэш'],['angry',16,'Злой'],['music',18,'Пэрадайс'],['move',21,'Движ'],['skibidi',25,'Скибиди'],['bro',30,'Бро'],['rich',40,'Богатый'],['thumb',45,'Так держать'],['flex',50,'Флекс'],['legend',67,'Легенда'],['sad',0,'Грустно'],['tired',0,'Устал']];
const PAN={spark:['breathe','z'],bell:['wobble',''],flash:['sway','s'],bro:['bounce','h'],legend:['glow','g'],happy:['breathe','h'],thumb:['bounce','h'],love:['pulse','h'],rofl:['shake',''],skibidi:['bounce',''],pon:['wobble',''],chill:['breathe',''],cringe:['wobble',''],sad:['droop',''],angry:['shake',''],genius:['breathe',''],tilt:['shake',''],move:['sway',''],rich:['bounce','$'],tired:['droop','z'],music:['bounce','n'],flex:['sway','s']};
const PPT={z:['z','Z'],s:['✦','✧'],h:['💜','💛','🤍'],g:['✦','👑','✨'],'$':['$','💵'],n:['♪','♫']};
const PH={happy:['Ура, ты сегодня писал(а)! 💜','Так держать, бро!','Серия растёт, и я вместе с ней!'],wait:['Напиши сегодня, не потеряй серию!','Я жду сообщение…'],sad:['Серия прервалась… начнём заново?','Мне грустно, напиши что-нибудь']};

const dIx=t=>{const d=new Date(t);return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dn=n=>n+' '+(n%10===1&&n%100!==11?'день':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'дня':'дней');
const PCN=n=>(PCOL.find(x=>x[0]===n)||[0,0,''])[2];
const petOpen=(n,s)=>s.best>=((PCOL.find(x=>x[0]===n)||[0,999])[1]);
const petImg=(n,x='')=>`<img class="pimg pa-${PAN[n][0]} ${x}" src="${PSP[n]}" alt="" draggable="false">`;
function petStat(id){const d=PET[id];if(!d)return null;const T=dIx(Date.now()),today=d.days.has(T);let s=0,x=today?T:T-1;while(d.days.has(x)){s++;x--}
const best=Math.max(d.best,s,PP().best[id]||0);let st=-1;PSTG.forEach((p,i)=>{if(s>=p[1])st=i});const nx=PSTG[st+1],b=st<0?0:PSTG[st][1];
return{today,s,best,st,nx,pr:nx?Math.min(100,Math.round((s-b)/(nx[1]-b)*100)):100,left:nx?nx[1]-s:0}}
function petPose(id,s){const c=PP().pose[id];if(c&&petOpen(c,s))return c;if(s.s===0)return s.best>0?'sad':'spark';if(!s.today&&new Date().getHours()>=19)return'tired';return PSTG[Math.max(0,s.st)][0]}
