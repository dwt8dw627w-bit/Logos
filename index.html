<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a0a0a">
<title>Logos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#272727;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#222}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"Inter","Segoe UI",Roboto,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
.i{width:22px;height:22px}
#root{height:100%}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.list,.main{min-width:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.main{position:fixed;inset:0;z-index:5;transform:translateX(100%);transition:.25s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app.chat .main{transform:none}
.nav{margin-top:auto;display:flex;border-top:1px solid var(--ln);padding:6px 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}.nav .on{color:#fff}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}.hd h1{font-size:26px;flex:1}
.sc{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}.row:active,.row.on{background:var(--s1)}
.b{flex:1;min-width:0}.n{font-weight:600}.sub{color:var(--mu);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:600;flex:none;background:linear-gradient(135deg,#444,#161616);color:#ddd}
.srch{margin:6px 16px 10px;background:var(--s2);border-radius:16px;padding:0 14px;height:44px;display:flex;align-items:center}.srch input{flex:1}
.btn{background:#f2f2f2;color:#000;border-radius:16px;height:46px;font-weight:600;padding:0 18px}
.sm{background:var(--s3);border-radius:12px;padding:6px 12px;font-size:13px}
.fld{display:block;margin:8px 16px;background:var(--s2);border-radius:14px;padding:10px 14px}.fld small{color:var(--mu);display:block;font-size:12px}.fld input,.fld textarea{width:100%;margin-top:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln)}.top .t{flex:1;min-width:0}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;background:var(--s2);border-radius:18px 18px 18px 6px;padding:8px 12px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--s3);border-radius:18px 18px 6px 18px}
.m time{font-size:11px;color:var(--mu);margin-left:8px;float:right;margin-top:6px}
.comp{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--ln);align-items:center}
.comp input{flex:1;background:var(--s2);border-radius:20px;height:42px;padding:0 16px}
.sp{filter:blur(6px);cursor:pointer;background:#ffffff1a;border-radius:6px;padding:0 2px;transition:.2s}.sp.show{filter:none}.ro .comp{display:none}
.empty{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mu)}
.login{height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;max-width:420px;margin:auto}
.login .fld{margin:0}.err{color:#f87171;font-size:13px;min-height:18px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#f2f2f2;color:#000;padding:8px 16px;border-radius:14px;z-index:30;font-weight:600;display:none}
.msgs{-webkit-overflow-scrolling:touch}
.m{border-radius:22px 22px 22px 8px;padding:9px 14px;transition:transform .2s}.m.me{border-radius:22px 22px 8px 22px}
.pop{animation:pop .24s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}}
.ph{display:block;width:240px;max-width:100%;border-radius:16px;margin-bottom:4px;cursor:zoom-in}
.rq{border-left:3px solid #fff;padding:3px 8px;margin-bottom:5px;font-size:12.5px;color:var(--mu);background:#ffffff0d;border-radius:8px;cursor:pointer}.rq b{color:#fff;display:block}.rq div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpl{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--ln);font-size:13px;animation:fi .2s}
.flash{animation:fl 1s}@keyframes fl{30%{background:#555}}
button,.row,.nav button{transition:transform .12s,background .2s,opacity .2s}button:active{transform:scale(.94)}
.main{transition:transform .34s cubic-bezier(.22,.8,.2,1)}.comp input{border-radius:22px}
.bn{height:130px;background:linear-gradient(135deg,#3a3a3a,#111) center/cover;position:relative;margin-bottom:54px}
.avw{position:absolute;left:16px;bottom:-46px;border:4px solid var(--bg);border-radius:50%;background:var(--bg)}
.ov{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top);animation:fi .2s}@keyframes fi{from{opacity:0}}
.imgov{position:fixed;inset:0;z-index:40;background:#000e;display:grid;place-items:center;animation:fi .2s}.imgov img{max-width:100%;max-height:100%}
@media(min-width:900px){#app{grid-template-columns:380px minmax(0,1fr)}.list{border-right:1px solid var(--ln)}.main{position:static;transform:none!important;padding:0}.nav{order:-1;border-top:0;border-bottom:1px solid var(--ln)}.bk{display:none}.empty.on{display:flex}}
</style></head><body>
<div id="root"></div><div class="toast" id="toast"></div>
<script>
const SB=supabase.createClient('https://uasxejcgjwsccygepcgo.supabase.co','sb_publishable_zt6YOPPIMRD0aXVW5k_6sg_NJEHkrwb');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 4-6 8-6s7.3 2 8 6"/>',back:'<path d="m15 5-7 7 7 7"/>',send:'<path d="M4 12 20 4l-5 16-3-6.5z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="370 370 520 520"><path fill="#fff" d="M540 379H790C780 440 770 470 750 495C715 530 670 544 615 544C520 546 455 610 450 700H430C400 700 380 682 380 660V525C380 440 450 379 540 379Z"/><path fill="#fff" d="M792 511H815C850 511 876 538 876 570V665C876 730 810 790 725 790H620C595 790 580 795 575 797C540 812 500 838 472 872V760C472 690 540 636 615 636H650C730 636 785 580 792 511Z"/></svg>`;
const av=(p,s=48)=>p?.avatar_url?`<img class="av" style="width:${s}px;height:${s}px" src="${esc(p.avatar_url)}">`:`<div class="av" style="width:${s}px;height:${s}px;font-size:${s/2.4}px">${esc(([...(p?.name||'?')][0]||'?').toUpperCase())}</div>`;
let tm;const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',2200)};
let me,prof,tab='chats',cur=null,chats=[],msgs=[],contacts=[],found=[];
let rp=null,nw=null,online=new Set();const at=u=>u?'@'+u:'';
const wide=()=>innerWidth>=900;
const fmt=d=>{if(!d)return'';const x=new Date(d),n=new Date();return x.toDateString()===n.toDateString()?x.toTimeString().slice(0,5):x.toLocaleDateString('ru',{day:'numeric',month:'short'})};
const prev=l=>({text:l.body,photo:'📷 Фото',video:'🎬 Видео',voice:'🎤 Голосовое',circle:'⭕ Кружок',file:'📎 Файл',sticker:'🙂 Стикер'}[l.kind]||l.body||'');

/* ---------- вход ---------- */
function login(mode='in',email=''){
const up=mode==='up';
$('#root').innerHTML=`<div class="login"><div style="text-align:center">${LOGO(90)}<h1 style="margin:10px 0 4px">Logos</h1><div class="sub">Общайся. Делись. Будь ближе.</div></div>
<label class="fld"><small>Почта</small><input id="em" type="email" placeholder="you@mail.com" autocomplete="email" value="${esc(email)}"></label>
<label class="fld"><small>Пароль</small><input id="pw" type="password" placeholder="Минимум 6 символов" autocomplete="${up?'new-password':'current-password'}"></label>
<div class="err" id="er"></div><button class="btn" id="go">${up?'Создать аккаунт':'Войти'}</button>
<div style="display:flex;justify-content:space-between"><button class="sub" id="sw">${up?'Уже есть аккаунт? Войти':'Создать аккаунт'}</button>${up?'':'<button class="sub" id="fg">Забыли пароль?</button>'}</div></div>`;
const go=$('#go'),er=t=>$('#er').textContent=t;
go.onclick=async()=>{const e=$('#em').value.trim(),p=$('#pw').value;if(!e||!p)return er('Введите почту и пароль');if(p.length<6)return er('Пароль минимум 6 символов');go.disabled=true;er('');
if(up){const{data,error}=await SB.auth.signUp({email:e,password:p});go.disabled=false;if(error)return er(error.message);if(data.session)start(data.user);else er('Мы отправили письмо — подтвердите почту и войдите')}
else{const{data,error}=await SB.auth.signInWithPassword({email:e,password:p});go.disabled=false;if(error)return er('Неверная почта или пароль');start(data.user)}};
$('#pw').onkeydown=ev=>{if(ev.key==='Enter')go.click()};
$('#sw').onclick=()=>login(up?'in':'up',$('#em').value);
if($('#fg'))$('#fg').onclick=async()=>{const e=$('#em').value.trim();if(!e)return er('Введите почту');const{error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});er(error?error.message:'Письмо для сброса пароля отправлено')}}

/* ---------- запуск ---------- */
async function start(u){me=u;
let r=await SB.from('profiles').select('*').eq('id',me.id).single();prof=r.data||{id:me.id,name:'user'};
$('#root').innerHTML=`<div id="app"><div class="list" id="list"></div><div class="main" id="main"></div></div>`;
await loadChats();render();live();
SB.channel('rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{const r=p.new;
if(cur&&r.chat_id===cur.id&&!msgs.find(m=>m.id===r.id)){nw=r.id;msgs.push(r);drawMsgs()}
await loadChats();if(tab==='chats')drawList()})
.on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_members',filter:'user_id=eq.'+me.id},async()=>{await loadChats();if(tab==='chats')drawList()}).subscribe()}

async function loadChats(){if(DEMO)return;
const{data:mem}=await SB.from('chat_members').select('chat_id,chats(id,kind,title,avatar_url)').eq('user_id',me.id);
const ids=(mem||[]).map(m=>m.chat_id);if(!ids.length){chats=[];return}
const[{data:oth},{data:ms}]=await Promise.all([
SB.from('chat_members').select('chat_id,profiles(id,name,username,avatar_url,last_seen,bio,banner_url)').in('chat_id',ids).neq('user_id',me.id),
SB.from('messages').select('chat_id,body,kind,created_at').in('chat_id',ids).order('created_at',{ascending:false}).limit(300)]);
chats=mem.map(m=>{const c=m.chats,o=(oth||[]).find(x=>x.chat_id===c.id)?.profiles,l=(ms||[]).find(x=>x.chat_id===c.id);
return{pid:o?.id,ls:o?.last_seen,bio:o?.bio,banner:o?.banner_url,user:o?.username,id:c.id,kind:c.kind,name:c.kind==='dm'?(o?.name||'Чат'):c.title,avatar_url:c.kind==='dm'?o?.avatar_url:c.avatar_url,sub:c.kind==='dm'&&o?.username?o.username:'',last:l?prev(l):'Нет сообщений',lt:l?.created_at||''}}).sort((a,b)=>b.lt>a.lt?1:-1)}

/* ---------- экраны ---------- */
const nav=()=>`<div class="nav">${[['chats','chat','Чаты'],['contacts','users','Контакты'],['search','search','Поиск'],['me','user','Профиль']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join('')}</div>`;
function go(t){tab=t;if(t==='contacts')loadContacts();render()}
function render(){drawList();drawMain()}
const row=(p,n,s,r,click)=>`<div class="row" onclick="${click}">${av(p)}<div class="b"><div class="n">${esc(n)}</div><div class="sub">${esc(s)}</div></div>${r||''}</div>`;
function drawList(){const hd=t=>`<div class="hd"><h1>${t}</h1></div>`;let h='';
if(tab==='chats')h=hd('Чаты')+`<div class="sc">${chats.length?chats.map(c=>row(c,c.name,c.last,`<span class="sub">${fmt(c.lt)}</span>`,`openChat('${c.id}')`)).join(''):'<div class="sub" style="padding:24px 16px">Чатов пока нет. Найдите человека во вкладке «Поиск».</div>'}</div>`;
if(tab==='contacts')h=hd('Контакты')+`<div class="sc">${contacts.length?contacts.map((p,i)=>row(p,p.name,at(p.username),'',`dm('${p.id}')`)).join(''):'<div class="sub" style="padding:24px 16px">Контактов нет. Добавьте через «Поиск».</div>'}</div>`;
if(tab==='search')h=hd('Поиск')+`<div class="srch"><input id="q" placeholder="Имя пользователя или имя" oninput="doSearch(this.value)"></div><div class="sc" id="res">${resHTML()}</div>`;
if(tab==='me')h=hd('Профиль')+`<div class="sc"><div class="bn" style="${prof.banner_url?`background-image:url(${esc(prof.banner_url)})`:''}"><div class="avw">${av(prof,92)}</div></div><div style="padding:0 16px"><div style="font-size:20px;font-weight:700">${esc(prof.name)}</div><div class="sub">@${esc(prof.username)}</div>${prof.bio?`<div style="margin-top:6px">${esc(prof.bio)}</div>`:''}<div style="display:flex;gap:8px;margin-top:10px"><label class="sm" style="cursor:pointer">Аватарка<input type="file" accept="image/*" hidden onchange="upAv(this.files[0])"></label><label class="sm" style="cursor:pointer">Баннер<input type="file" accept="image/*" hidden onchange="upBn(this.files[0])"></label></div></div>
<label class="fld"><small>Имя</small><input id="pn" value="${esc(prof.name)}"></label><label class="fld"><small>Имя пользователя</small><input id="pu" value="@${esc(prof.username)}"></label><label class="fld"><small>О себе</small><textarea id="pb" rows="2">${esc(prof.bio)}</textarea></label>
<div style="display:flex;gap:10px;padding:8px 16px"><button class="btn" style="flex:1" onclick="saveProf()">Сохранить</button><button class="sm" onclick="SB.auth.signOut().then(()=>location.reload())">Выйти</button></div><div class="sub" style="padding:6px 16px">${esc(me.email)} · v5</div></div>`;
const keep=document.activeElement?.id==='q'?$('#q').value:null;
$('#list').innerHTML=h+nav();if(keep!==null){const q=$('#q');q.value=keep;q.focus()}}
const resHTML=()=>found.map((p,i)=>row(p,p.name,at(p.username),`<button class="sm" onclick="event.stopPropagation();addC('${p.id}')">В контакты</button>`,`dm('${p.id}')`)).join('')||'<div class="sub" style="padding:16px">Введите имя — найдём людей в Logos</div>';
let st;function doSearch(v){clearTimeout(st);st=setTimeout(async()=>{v=v.replace(/[,()%]/g,'').replace(/^@/,'').trim();if(v.length<2){found=[];$('#res').innerHTML=resHTML();return}
if(DEMO){found=PEOPLE.filter(p=>(p.name+p.username).toLowerCase().includes(v.toLowerCase()));$('#res').innerHTML=resHTML();return}const{data}=await SB.from('profiles').select('id,name,username,avatar_url').or(`username.ilike.%${v}%,name.ilike.%${v}%`).neq('id',me.id).limit(20);found=data||[];$('#res').innerHTML=resHTML()},300)}
async function loadContacts(){if(DEMO){drawList();return}const{data}=await SB.from('contacts').select('p:profiles!contact(id,name,username,avatar_url)').eq('owner',me.id);contacts=(data||[]).map(x=>x.p);if(tab==='contacts')drawList()}
async function addC(id){if(DEMO)return toast('Добавлен в контакты');const{error}=await SB.from('contacts').upsert({contact:id});toast(error?'Не удалось':'Добавлен в контакты')}
async function dm(id){if(DEMO){const c=chats.find(x=>x.pid===id);return c&&openChat(c.id)}const{data,error}=await SB.rpc('create_dm',{other:id});if(error)return toast('Ошибка чата');await loadChats();openChat(data)}

const fx=t=>esc(t).replace(/\|\|(.+?)\|\|/g,'<span class="sp" onclick="this.classList.toggle(\'show\')">$1</span>');
function spoil(){const i=$('#in'),a=i.selectionStart,b=i.selectionEnd;i.value=a===b?i.value+'||текст||':i.value.slice(0,a)+'||'+i.value.slice(a,b)+'||'+i.value.slice(b);i.focus()}
function drawMain(){const m=$('#main');m.classList.toggle('ro',cur?.kind==='channel');
if(!cur){m.innerHTML=`<div class="empty on">${LOGO(80)}<div>Выберите чат</div></div>`;return}
m.innerHTML=`<div class="top"><button class="ib bk" onclick="closeChat()">${ic('back')}</button>${av(cur,40)}<div class="t" onclick="showP()" style="cursor:pointer"><div class="n">${esc(cur.name)}</div><div class="sub" id="st">${esc(status(cur))}</div></div></div><div class="msgs" id="ms"></div><div id="rpb"></div><div class="comp"><label class="ib" style="background:var(--s2);cursor:pointer">${ic('clip')}<input type="file" accept="image/*" hidden onchange="sendPhoto(this.files[0]);this.value=''"></label><input id="in" placeholder="Написать сообщение…" onkeydown="if(event.key==='Enter')send()"><button class="ib" style="background:var(--s2)" title="Скрытый текст" onclick="spoil()">◐</button><button class="ib" style="background:#f2f2f2;color:#000;border-radius:50%" onclick="send()">${ic('send')}</button></div>`;drawMsgs();swInit();drawRp()}
function drawMsgs(){const e=$('#ms');if(!e)return;e.innerHTML=msgs.map(mh).join('');e.scrollTo({top:e.scrollHeight,behavior:nw?'smooth':'auto'});nw=null}
async function openChat(id){rp=null;cur=chats.find(c=>c.id===id);const{data}=DEMO?{data:DM[id]}:await SB.from('messages').select('*').eq('chat_id',id).order('created_at').limit(200);msgs=data||[];$('#app').classList.add('chat');drawMain();if(wide())$('#in')?.focus()}
function closeChat(){cur=null;$('#app').classList.remove('chat');drawMain()}
async function send(){const i=$('#in'),v=i.value.trim();if(!v||!cur)return;i.value='';await ins({kind:'text',body:v});i.focus()}

/* ---------- профиль ---------- */
async function saveProf(){if(DEMO)return toast('В демо не сохраняется');const u={name:$('#pn').value.trim()||prof.name,username:$('#pu').value.trim().replace(/^@/,'').toLowerCase(),bio:$('#pb').value.trim()};
const{error}=await SB.from('profiles').update(u).eq('id',me.id);if(error)return toast(error.code==='23505'?'Это имя занято':'Ошибка');Object.assign(prof,u);toast('Сохранено')}


/* ---------- фото, ответы, статус, профили ---------- */
async function img(f,w,h){const bm=await createImageBitmap(f);let cw,ch,sx=0,sy=0,sw=bm.width,sh=bm.height;
if(h){cw=w;ch=h;const k=Math.max(w/bm.width,h/bm.height);sw=w/k;sh=h/k;sx=(bm.width-sw)/2;sy=(bm.height-sh)/2}else{const k=Math.min(1,w/Math.max(bm.width,bm.height));cw=Math.round(bm.width*k);ch=Math.round(bm.height*k)}
const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(bm,sx,sy,sw,sh,0,0,cw,ch);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function up(bucket,blob){const path=`${me.id}/${Date.now()}.jpg`;const{error}=await SB.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg'});return error?null:SB.storage.from(bucket).getPublicUrl(path).data.publicUrl}
async function upAv(f){if(!f)return;const url=await up('avatars',await img(f,320,320));if(!url)return toast('Не загрузилось');await SB.from('profiles').update({avatar_url:url}).eq('id',me.id);prof.avatar_url=url;toast('Аватарка обновлена');drawList()}
async function upBn(f){if(!f)return;const url=await up('avatars',await img(f,1000,400));if(!url)return toast('Не загрузилось');const{error}=await SB.from('profiles').update({banner_url:url}).eq('id',me.id);if(error)return toast('Нужно обновить базу (logos-update.sql)');prof.banner_url=url;toast('Баннер обновлён');drawList()}
async function ins(r){const{data,error}=await SB.from('messages').insert({chat_id:cur.id,reply_to:rp?.id||null,...r}).select().single();if(error)return toast('Не отправилось');rp=null;drawRp();if(!msgs.find(m=>m.id===data.id)){nw=data.id;msgs.push(data);drawMsgs()}await loadChats();if(tab==='chats')drawList()}
async function sendPhoto(f){if(!f||!cur)return;toast('Отправка фото…');const url=await up('media',await img(f,1280));if(!url)return toast('Не загрузилось');await ins({kind:'photo',media_url:url})}
function mh(m,i){const mine=m.sender_id===me.id;let q='';
if(m.reply_to){const r=msgs.find(x=>x.id===m.reply_to);q=r?`<div class="rq" onclick="event.stopPropagation();jump(${r.id})"><b>${r.sender_id===me.id?'Вы':esc(r.sender_id?cur.name:'Logos')}</b><div>${esc(prev(r))}</div></div>`:'<div class="rq"><div>Сообщение недоступно</div></div>'}
const b=m.kind==='photo'&&m.media_url?`<img class="ph" src="${esc(m.media_url)}" onclick="view(this.src)">`+(m.body?`<div>${fx(m.body)}</div>`:''):fx(m.kind==='text'?m.body:prev(m));
return `<div class="m${mine?' me':''}${m.id===nw?' pop':''}" id="m${m.id}" data-i="${i}" ondblclick="setRp(${i})">${m.sender_id?'':'<b>Logos</b><br>'}${q}${b}<time>${fmt(m.created_at)}</time></div>`}
function setRp(i){if(cur?.kind==='channel')return;rp=msgs[i];drawRp();$('#in')?.focus()}
function drawRp(){const e=$('#rpb');if(!e)return;e.innerHTML=rp?`<div class="rpl"><div class="b"><b>Ответ ${rp.sender_id===me.id?'себе':esc(rp.sender_id?cur.name:'Logos')}</b><div class="sub">${esc(prev(rp))}</div></div><button onclick="rp=null;drawRp()">✕</button></div>`:''}
function jump(id){const e=$('#m'+id);if(!e)return;e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}
let sw=null;
function swInit(){const ms=$('#ms');if(!ms)return;
ms.ontouchstart=ev=>{const m=ev.target.closest('.m');sw=m?{m,x:ev.touches[0].clientX,y:ev.touches[0].clientY,d:0}:null};
ms.ontouchmove=ev=>{if(!sw)return;const dx=ev.touches[0].clientX-sw.x,dy=ev.touches[0].clientY-sw.y;if(!sw.d&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(dx<0){sw.d=Math.min(-dx,80);sw.m.style.transition='none';sw.m.style.transform=`translateX(${-sw.d}px)`}};
ms.ontouchend=()=>{if(!sw)return;const{m,d}=sw;m.style.transition='transform .2s';m.style.transform='';if(d>55){setRp(+m.dataset.i);navigator.vibrate?.(10)}sw=null}}
function view(u){const o=document.createElement('div');o.className='imgov';o.innerHTML=`<img src="${esc(u)}">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
function ago(ls){const d=new Date(ls),n=new Date(),s=(n-d)/1000;if(s<70)return'в сети';const hm=d.toTimeString().slice(0,5);if(s<3600)return`был(а) ${Math.round(s/60)} мин. назад`;if(d.toDateString()===n.toDateString())return`был(а) в ${hm}`;if(d.toDateString()===new Date(n-864e5).toDateString())return`был(а) вчера в ${hm}`;return`был(а) ${d.toLocaleDateString('ru',{day:'numeric',month:'short'})}`}
function status(c){if(c.kind!=='dm')return c.kind==='channel'?'канал':'группа';if(online.has(c.pid))return'в сети';return c.ls?ago(c.ls):''}
function drawStatus(){const e=$('#st');if(e&&cur){cur=chats.find(c=>c.id===cur.id)||cur;e.textContent=status(cur)}}
const beat=()=>SB.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id);
function live(){beat();setInterval(async()=>{beat();await loadChats();drawStatus()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat()});
const pc=SB.channel('online',{config:{presence:{key:me.id}}});pc.on('presence',{event:'sync'},()=>{online=new Set(Object.keys(pc.presenceState()));drawStatus()}).subscribe(async s=>{if(s==='SUBSCRIBED')await pc.track({at:Date.now()})})}
function showP(){const c=cur;if(!c||c.kind!=='dm')return;const o=document.createElement('div');o.className='ov';
o.innerHTML=`<div class="bn" style="${c.banner?`background-image:url(${esc(c.banner)})`:''}"><button class="ib" style="position:absolute;left:10px;top:10px;background:#0008;border-radius:50%" onclick="this.closest('.ov').remove()">${ic('back')}</button><div class="avw">${av(c,92)}</div></div><div style="padding:0 16px"><div style="font-size:22px;font-weight:700">${esc(c.name)}</div><div class="sub">${esc(status(c))}</div><div style="margin:12px 0 2px;color:var(--mu);font-size:12px">Имя пользователя</div><div>@${esc(c.user||'')}</div>${c.bio?`<div style="margin:12px 0 2px;color:var(--mu);font-size:12px">О себе</div><div>${esc(c.bio)}</div>`:''}</div>`;document.body.appendChild(o)}

const DEMO=false,PEOPLE=[],DM={};
(async()=>{const{data:{session}}=await SB.auth.getSession();session?start(session.user):login()})();
</script></body></html>
