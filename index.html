<script>
const SB=supabase.createClient('https://uasxejcgjwsccygepcgo.supabase.co','sb_publishable_zt6YOPPIMRD0aXVW5k_6sg_NJEHkrwb');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={chat:'<path d="M20 11.5c0 4-3.6 7-8 7-1 0-1.9-.1-2.8-.4L5 20l1-3.5C4.7 15.3 4 13.5 4 11.5c0-4 3.6-7 8-7s8 3 8 7z"/>',users:'<circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 19.5c.5-3.3 3-5 6.2-5s5.7 1.7 6.2 5M16 5.2a3.3 3.3 0 0 1 0 6.3M18.5 14.7c1.6.6 2.7 2.1 3 4.8"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.9-3.9"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.6 3.6-5.5 7.5-5.5s6.9 1.9 7.5 5.5"/>',back:'<path d="m15 5-7 7 7 7"/>',clip:'<path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7L9.5 17a1.7 1.7 0 0 1-2.4-2.4L14 7.7"/>',trash:'<path d="M4 7h16M10 4h4"/><path d="m6 7 .8 12a2 2 0 0 0 2 1.9h6.4a2 2 0 0 0 2-1.9L18 7M10 11v5M14 11v5"/>',archive:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>',bellOff:'<path d="M8.7 3.7A6 6 0 0 1 18 9c0 2.2.4 3.8 1 5M6 8.5c0 4.5-1.5 6-2.5 7H15M10 20a2 2 0 0 0 4 0M3 3l18 18"/>',send:'<path d="M21 3 10 14"/><path d="m21 3-7 18-4-7-7-4z"/>',reply:'<path d="m9 14-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',down:'<path d="m6 9 6 6 6-6"/>'};

const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="370 370 520 520"><path fill="#fff" d="M540 379H790C780 440 770 470 750 495C715 530 670 544 615 544C520 546 455 610 450 700H430C400 700 380 682 380 660V525C380 440 450 379 540 379Z"/><path fill="#fff" d="M792 511H815C850 511 876 538 876 570V665C876 730 810 790 725 790H620C595 790 580 795 575 797C540 812 500 838 472 872V760C472 690 540 636 615 636H650C730 636 785 580 792 511Z"/></svg>`;

let tm;const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',2200)};
let me,prof,tab='chats',cur=null,chats=[],msgs=[],contacts=[],found=[];
let lastTab='',wasOpen=false,tapT=0,pend=0,tch=null,tl=0,tt=0,MC={},swiped=false,rp=null,nw=null,online=new Set(),arch=false,openRow=null,rs=null;const at=u=>u?'@'+u:'';

const prev=l=>({text:l.body,photo:'📷 Фото',video:'🎬 Видео',voice:'🎤 Голосовое',circle:'⭕ Кружок',file:'📎 Файл',sticker:'🙂 Стикер'}[l.kind]||l.body||'');

/* ---------- вход ---------- */
function login(mode='in',email=''){
const up=mode==='up';
$('#root').innerHTML=`<div class="login"><div style="text-align:center">${LOGO(90)}<h1 style="margin:10px 0 4px">Logos</h1><div class="sub">Общайся. Делись. Будь ближе.</div></div>
<label class="fld"><small>Почта</small><input id="em" type="email" placeholder="you@mail.com" autocomplete="email" value="${esc(email)}"></label>
<label class="fld"><small>Пароль</small><input id="pw" type="password" placeholder="Минимум 6 символов" autocomplete="${up?'new-password':'current-password'}"></label>
<div class="err" id="er"></div><button class="btn" id="go">${up?'Создать аккаунт':'Войти'}</button>
<div style="display:flex;justify-content:space-between"><button class="sub" id="sw">${up?'Уже есть аккаунт? Войти':'Создать аккаунт'}</button>${up?'':'<button class="sub" id="fg">Забыли пароль?</button>'}</div></div>`;
const go=$('#go'),er=t=>$('#er').textContent=t;
go.onclick=async()=>{const e=$('#em').value.trim(),p=$('#pw').value;if(!e||!p)return er('Введите почту и пароль');if(p.length<6)return er('Пароль минимум 6 символов');go.disabled=true;er('');
if(up){const{data,error}=await SB.auth.signUp({email:e,password:p});go.disabled=false;if(error)return er(error.message);if(data.session)start(data.user);else er('Мы отправили письмо — подтвердите почту и войдите')}
else{const{data,error}=await SB.auth.signInWithPassword({email:e,password:p});go.disabled=false;if(error)return er('Неверная почта или пароль');start(data.user)}};
$('#pw').onkeydown=ev=>{if(ev.key==='Enter')go.click()};
$('#sw').onclick=()=>login(up?'in':'up',$('#em').value);
if($('#fg'))$('#fg').onclick=async()=>{const e=$('#em').value.trim();if(!e)return er('Введите почту');const{error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});er(error?error.message:'Письмо для сброса пароля отправлено')}}

/* ---------- запуск ---------- */
async function start(u){me=u;
let r=await SB.from('profiles').select('*').eq('id',me.id).single();prof=r.data||{id:me.id,name:'user'};
$('#root').innerHTML=`<div id="app"><div class="list" id="list"><div class="lc" id="lc"></div><div class="nav" id="nav"></div></div><div class="main" id="main"></div></div>`;
await loadChats();render();live();rowInit();
SB.channel('rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{const r=p.new;
if(cur&&r.chat_id===cur.id&&!msgs.find(m=>m.id===r.id)&&!(r.sender_id===me.id&&pend>0))addMsg(r)
await loadChats();if(tab==='chats')drawList()})
.on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_members',filter:'user_id=eq.'+me.id},async()=>{await loadChats();if(tab==='chats')drawList()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_members'},p=>{const r=p.new;if(!r||r.user_id===me.id)return;const c=chats.find(x=>x.id===r.chat_id);if(c){c.olr=r.last_read;c.lr=!!(c.lm&&c.lt&&new Date(r.last_read)>=new Date(c.lt))}if(cur&&cur.id===r.chat_id){cur.olr=r.last_read;refreshTicks()}if(tab==='chats')drawList()}).subscribe()}

async function loadChats(){if(DEMO)return;
let rr=await SB.from('chat_members').select('chat_id,role,archived,muted,last_read,chats(id,kind,title,avatar_url)').eq('user_id',me.id);
if(rr.error)rr=await SB.from('chat_members').select('chat_id,role,archived,muted,chats(id,kind,title,avatar_url)').eq('user_id',me.id);
if(rr.error)rr=await SB.from('chat_members').select('chat_id,role,chats(id,kind,title,avatar_url)').eq('user_id',me.id);
const mem=rr.data||[],ids=mem.map(m=>m.chat_id);if(!ids.length){chats=[];return}
const PR='profiles(id,name,username,avatar_url,last_seen,bio,banner_url)';
let[o1,ms]=await Promise.all([SB.from('chat_members').select('chat_id,last_read,'+PR).in('chat_id',ids).neq('user_id',me.id),SB.from('messages').select('chat_id,sender_id,body,kind,created_at').in('chat_id',ids).order('created_at',{ascending:false}).limit(300)]);
if(o1.error)o1=await SB.from('chat_members').select('chat_id,'+PR).in('chat_id',ids).neq('user_id',me.id);
const oth=o1.data||[],ml=ms.data||[];
chats=mem.map(m=>{const c=m.chats,ox=oth.find(x=>x.chat_id===c.id),o=ox?.profiles,l=ml.find(x=>x.chat_id===c.id),olr=ox?.last_read||null;
const mlr=m.last_read,un=(cur&&cur.id===c.id&&!document.hidden)?0:ml.filter(x=>x.chat_id===c.id&&x.sender_id!==me.id&&mlr&&new Date(x.created_at)>new Date(mlr)).length;
return{un,arch:m.archived,muted:m.muted,role:m.role,olr,pid:o?.id,ls:o?.last_seen,bio:o?.bio,banner:o?.banner_url,user:o?.username,id:c.id,kind:c.kind,name:c.kind==='dm'?(o?.name||'Чат'):c.title,avatar_url:c.kind==='dm'?o?.avatar_url:c.avatar_url,sub:'',last:l?prev(l):'Нет сообщений',lt:l?.created_at||'',lm:l?l.sender_id===me.id:false,lr:!!(l&&olr&&new Date(olr)>=new Date(l.created_at))}}).sort((a,b)=>b.lt>a.lt?1:-1)}

/* ---------- экраны ---------- */
const nav=()=>`<div class="nav">${[['chats','chat','Чаты'],['contacts','users','Контакты'],['me','user','Профиль']].map(x=>`<button class="${tab===x[0]||(tab==='search'&&x[0]==='chats')?'on':''}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join('')}</div>`;
function go(t){tab=t;arch=false;if(t==='contacts')loadContacts();render();$('#list .sc')?.classList.add('tabin')}

async function img(f,w,h){const bm=await createImageBitmap(f);let cw,ch,sx=0,sy=0,sw=bm.width,sh=bm.height;
if(h){cw=w;ch=h;const k=Math.max(w/bm.width,h/bm.height);sw=w/k;sh=h/k;sx=(bm.width-sw)/2;sy=(bm.height-sh)/2}else{const k=Math.min(1,w/Math.max(bm.width,bm.height));cw=Math.round(bm.width*k);ch=Math.round(bm.height*k)}
const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(bm,sx,sy,sw,sh,0,0,cw,ch);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function up(bucket,blob){const path=`${me.id}/${Date.now()}.jpg`;const{error}=await SB.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg'});return error?null:SB.storage.from(bucket).getPublicUrl(path).data.publicUrl}

ms.ontouchstart=ev=>{const t=ev.touches[0],m=ev.target.closest('.m');sw=m&&t.clientX>=24?{m,x:t.clientX,y:t.clientY,d:0}:null};

function rowInit(){const L=$('#list');
L.addEventListener('click',e=>{clearTimeout(tapT);if(e.target.closest('.acts'))return;if(openRow){e.stopPropagation();e.preventDefault();closeRow();return}if(wasOpen){wasOpen=false;e.stopPropagation();e.preventDefault();return}const r=e.target.closest('.sr .row');if(r&&r.dataset.id&&!swiped)openChat(r.dataset.id)},true);
L.addEventListener('touchstart',e=>{if(e.target.closest('.acts')){rs=null;return}const r=e.target.closest('.sr .row');wasOpen=!!openRow;if(!r){closeRow();rs=null;return}if(openRow&&openRow!==r)closeRow();rs={r,x:e.touches[0].clientX,y:e.touches[0].clientY,o:openRow===r?-210:0,m:0,g:false}},{passive:true});
L.addEventListener('touchmove',e=>{if(!rs)return;const dx=e.touches[0].clientX-rs.x,dy=e.touches[0].clientY-rs.y;if(!rs.g){if(Math.abs(dy)>Math.abs(dx)){rs=null;return}if(Math.abs(dx)>8){rs.g=true;rs.r.parentElement.classList.add('sw')}else return}swiped=true;rs.m=Math.max(-230,Math.min(0,rs.o+dx));rs.r.style.transition='none';rs.r.style.transform=`translateX(${rs.m}px)`},{passive:true});
L.addEventListener('touchend',()=>{setTimeout(()=>swiped=false,60);if(!rs)return;const{r,m,g}=rs;rs=null;if(!g){if(!wasOpen&&r.dataset.id){clearTimeout(tapT);tapT=setTimeout(()=>openChat(r.dataset.id),380)}return}r.style.transition='';if(m<-90){r.style.transform='translateX(-210px)';openRow=r}else{if(openRow===r)openRow=null;shut(r)}})}
function updNav(){const n=$('#nav');if(!n)return;const T=[['chats','chat','Чаты'],['contacts','users','Контакты'],['me','user','Профиль']];
if(!n.firstChild)n.innerHTML='<i class="pl"></i>'+T.map(x=>`<button onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join('');
const i=tab==='search'?0:Math.max(0,T.findIndex(x=>x[0]===tab));n.querySelector('.pl').style.transform=`translateX(${i*100}%)`;n.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i))}
const tickSvg=(rd,pd)=>`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="${rd?'#6cb6ff':'currentColor'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${pd?'<circle cx="12" cy="12" r="7.5" stroke-width="1.8"/><path d="M12 8v4l2.5 1.5" stroke-width="1.8"/>':rd?'<path d="M1.5 13l4 4L15 7M9.5 15l2 2L22 7"/>':'<path d="M5 13l4 4L19 7"/>'}</svg>`;
function refreshTicks(){document.querySelectorAll('#ms .tk').forEach(e=>{e.innerHTML=tickSvg(cur?.olr&&new Date(cur.olr)>=new Date(e.dataset.t))})}
function markRead(){if(!cur||document.hidden)return;if(cur.un){cur.un=0;if(tab==='chats')drawList()}SB.from('chat_members').update({last_read:new Date().toISOString()}).eq('chat_id',cur.id).eq('user_id',me.id).then(()=>{})}
async function setCM(id,f){const c=chats.find(x=>x.id===id);if(!c)return;const{error}=await SB.from('chat_members').update({[f]:!c[f==='muted'?'muted':'arch']}).eq('chat_id',id).eq('user_id',me.id);if(error)return toast('Нужно обновить базу (logos-update2.sql)');if(f==='muted')c.muted=!c.muted;else c.arch=!c.arch;drawList()}
const muteC=id=>setCM(id,'muted'),archC=id=>setCM(id,'archived');
function delAsk(id){const c=chats.find(x=>x.id===id);if(!c)return;const dm=c.kind==='dm',all=dm||c.role==='owner'||c.role==='admin';const o=document.createElement('div');o.className='dlg';o.onclick=e=>{if(e.target===o)o.remove()};
o.innerHTML=`<div><div style="font-weight:700;font-size:17px">Удалить чат «${esc(c.name)}»?</div><div class="sub" style="margin-top:4px;white-space:normal">Переписка исчезнет из вашего списка.</div>${all?`<label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="dall" style="width:20px;height:20px">Также удалить для ${dm?esc(c.name):'всех'}</label>`:''}<button class="b2" style="background:#dc2626;color:#fff" onclick="delDo('${id}')">Удалить</button><button class="b2" style="background:var(--s3)" onclick="this.closest('.dlg').remove()">Отмена</button></div>`;document.body.appendChild(o)}
async function delDo(id){const all=$('#dall')?.checked;const q=all?SB.from('chats').delete().eq('id',id):SB.from('chat_members').delete().eq('chat_id',id).eq('user_id',me.id);const{error}=await q;document.querySelector('.dlg')?.remove();if(error)return toast(all?'Нужно обновить базу (logos-update2.sql)':'Не удалось');if(cur?.id===id){$('#app').classList.remove('chat');cur=null;drawMain()}await loadChats();drawList()}

const DEMO=false,PEOPLE=[],DM={};
(async()=>{const{data:{session}}=await SB.auth.getSession();session?start(session.user):login()})();
</script></body></html>
