const seg=(o,cur,fn)=>`<div class="seg">${o.map(x=>`<button class="${String(cur)===String(x[0])?'on':''}" onclick="${fn}('${x[0]}',this)">${x[1]}</button>`).join('')}</div>`,tg=(k,t)=>`<div class="tgr" onclick="tgl('${k}',this)"><span>${t}</span><i class="tgs${PF[k]?' on':''}"></i></div>`;
const mark=el=>el.parentElement.querySelectorAll('button,.tl').forEach(b=>b.classList.toggle('on',b===el));
function tgl(k,el){PF[k]=PF[k]?0:1;savePF();el.querySelector('.tgs').classList.toggle('on',!!PF[k]);if(k==='wp')applyPF();vib(8)}
function sheetProf(){sheet('Профиль',`<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">${av(prof,64)}<div style="display:flex;gap:8px;flex-wrap:wrap"><label class="sm" style="cursor:pointer">Фото<input type="file" accept="image/*" hidden onchange="upAv(this.files[0])"></label><label class="sm" style="cursor:pointer">Баннер<input type="file" accept="image/*" hidden onchange="upBn(this.files[0])"></label></div></div><label class="fld"><small>Имя</small><input id="pn" value="${esc(prof.name)}"></label><label class="fld"><small>Имя пользователя</small><input id="pu" value="@${esc(prof.username)}"></label><label class="fld"><small>Номер телефона</small><input id="pph" type="tel" placeholder="+7 …" value="${esc(prof.phone)}"></label><label class="fld"><small>О себе</small><textarea id="pb" rows="2">${esc(prof.bio)}</textarea></label><button class="btn" style="width:100%;margin-top:8px" onclick="saveProf()">Сохранить</button>`)}
function sheetPriv(){const v=PV(),g=k=>v[k]||'all';sheet('Конфиденциальность',`<div class="pl2">Кто видит мой номер телефона</div>${seg([['all','Все'],['contacts','Контакты'],['nobody','Никто']],g('phone'),"setPv.bind(null,'phone')")}<div class="pl2">Кто видит время захода</div>${seg([['all','Все'],['nobody','Никто']],g('seen'),"setPv.bind(null,'seen')")}<div class="pl2">Кто видит моё имя пользователя</div>${seg([['all','Все'],['nobody','Никто']],g('user'),"setPv.bind(null,'user')")}`)}
function setPv(k,val,el){const v={...PV(),[k]:val};prof.priv=v;PF.priv=v;savePF();mark(el);vib(8);SB.from('profiles').update({priv:v}).eq('id',me.id).then(r=>{if(r.error)toast('Сохранено у вас (нужен logos-update5.sql)')});if(k==='seen'){try{val==='nobody'?PC?.untrack():PC?.track({at:Date.now()})}catch(x){}}}
function sheetNot(){sheet('Уведомления',tg('snd','Звук новых сообщений')+tg('vib','Вибрация'))}
const TH=[['mono','Монохром','#0a0a0a','#f2f2f2'],['graph','Графит','#17181a','#9aa4b5'],['ocean','Океан','#0a111d','#3b95f0'],['forest','Лес','#09110d','#2fbf80'],['dusk','Закат','#110a14','#a45cf0']];
function sheetTheme(){sheet('Оформление',`<div class="thg">${TH.map(t=>`<div class="tl${PF.th===t[0]?' on':''}" onclick="setTh('${t[0]}',this)"><i style="background:${t[2]}"><b style="background:${t[3]}"></b></i>${t[1]}</div>`).join('')}</div><div class="pl2">Размер текста</div>${seg([[.9,'Мелкий'],[1,'Обычный'],[1.12,'Крупный']],PF.fs,'setFs')}${tg('wp','Узор на фоне чата')}`)}
function setTh(k,el){PF.th=k;savePF();applyPF();mark(el);vib(8)}
function setFs(v,el){PF.fs=+v;savePF();applyPF();mark(el)}
function sheetAbout(){sheet('Logos',`<div style="text-align:center;padding:8px 0 4px">${LOGO(64)}<div style="font-weight:700;margin-top:8px">Logos v10</div><div class="sub">${esc(me.email)}</div></div>`)}

const DEMO=false,PEOPLE=[],DM={};
(async()=>{const{data:{session}}=await SB.auth.getSession();session?start(session.user):login()})();
</script></body></html>
