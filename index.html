/* клавиатура: поле ввода всегда над клавиатурой, особенно на Android */
.kbx .main{padding-bottom:var(--kbx,0px)}
.kbx .sh{padding-bottom:var(--kbx,0px)}
.kbx #root>.login{padding-bottom:calc(24px + var(--kbx,0px));overflow:auto}
.android.kb .main{padding-bottom:calc(var(--kbe,16px) + var(--kbx,0px))}
.android.kb .comp{padding-bottom:10px}
.comp{will-change:auto}.msgs{overflow-anchor:none}
.m a{color:inherit;text-decoration:underline;text-underline-offset:2px;word-break:break-all}

/* превью тем: фон, твои сообщения и сообщения собеседника */
.pvw{--tx:#f2f2f2;--mu:#8a8a8a;--hl:#ffffff14;position:relative;height:78px;border-radius:12px;background:var(--bg);padding:15px 7px 6px;display:flex;flex-direction:column;gap:4px;overflow:hidden;margin-bottom:6px;color:var(--tx);border:1px solid var(--ln,#ffffff14);text-align:left}
.pvw::before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--hl) 1px,transparent 1.3px);background-size:9px 9px}
.pvw::after{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:var(--s1);box-shadow:0 1px 0 var(--ln)}
.pvw u{display:block;position:relative;text-decoration:none;height:15px;width:60%;border-radius:8px 8px 8px 3px;background:var(--s2);color:var(--tx);z-index:1}
.pvw u::after{content:'';position:absolute;left:6px;top:5.5px;height:4px;width:55%;border-radius:2px;background:currentColor;opacity:.5}
.pvw u.m{align-self:flex-end;width:52%;border-radius:8px 8px 3px 8px;background:var(--me);color:var(--mt)}
.pvw u.s{width:38%}
.pvw[data-theme=mono]{--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#272727;--ln:#222;--ac:#f2f2f2;--acx:#0a0a0a;--me:#f2f2f2;--mt:#0a0a0a;--tk:#0a0a0a}
.tl{padding:6px 6px 8px}
.cvb{display:flex;gap:12px;align-items:center;margin-bottom:12px}.cvb .tl{width:108px;flex:none}.cvc{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.hue{-webkit-appearance:none;appearance:none;width:100%;height:26px;border-radius:13px;background:linear-gradient(90deg,hsl(0 90% 60%),hsl(60 90% 60%),hsl(120 90% 55%),hsl(180 90% 55%),hsl(240 90% 65%),hsl(300 90% 60%),hsl(360 90% 60%));touch-action:pan-x}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #0007;box-shadow:0 2px 8px #0006}
.hue::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0007}
.vol{width:100%;accent-color:var(--ac);height:30px;touch-action:pan-x}
.thg .gt{grid-column:1/-1;margin:8px 2px 0}
.sng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.snb{padding:11px 4px;border-radius:12px;background:var(--s2);font-size:12.5px;border:2px solid transparent;color:var(--tx);transition:border-color .2s,transform .15s}.snb.on{border-color:var(--ac)}

/* звонки */
.cl{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 70px) 24px calc(env(safe-area-inset-bottom) + 44px);background:var(--bg);color:var(--tx);animation:fi .3s;overflow:hidden;transition:opacity .3s,transform .3s}
.cl.bye{opacity:0;transform:scale(1.04)}
.clbg{position:absolute;inset:0;background:radial-gradient(80% 46% at 50% 10%,var(--ac),transparent 70%),radial-gradient(70% 40% at 50% 112%,var(--ac2),transparent 70%);opacity:.3}
.cltop{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.clav{position:relative;width:132px;height:132px;margin-bottom:12px}
.clav .av{width:132px;height:132px;font-size:54px}
.clav::before,.clav::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:cring 2.4s ease-out infinite}.clav::after{animation-delay:1.2s}
@keyframes cring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.cl.on .clav::before,.cl.on .clav::after{animation:none}
.cln{font-size:27px;font-weight:700}.cls{color:var(--mu);font-variant-numeric:tabular-nums;font-size:16px}
.clb{position:relative;z-index:2;display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.clk{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mu)}
.clk button{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--tx)}.clk button .i{width:28px;height:28px}
.clk .red{background:#ef3f55;color:#fff}.clk .grn{background:#22c55e;color:#fff}.clk .tog.on{background:var(--tx);color:var(--bg)}
.cl #rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
.cl.vid.on #rv{display:block}
.cl #lv{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);width:98px;height:138px;object-fit:cover;border-radius:16px;background:#111;display:none;z-index:3;transform:scaleX(-1);box-shadow:0 6px 22px #0009}
.cl.vid.on #lv{display:block}
.cl.vid.on{color:#fff}.cl.vid.on .clbg,.cl.vid.on .clav{display:none}
.cl.vid.on .cltop{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;align-items:flex-start;text-align:left;text-shadow:0 1px 10px #000c}
.cl.vid.on .cls,.cl.vid.on .clk{color:#ffffffcc}
.cl.vid.on .cln{font-size:20px}
.cl.vid.on .clb{margin-top:auto}

/* ---- v13: стикеры ---- */
.stw{min-height:280px}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;max-height:48vh;overflow:auto;padding:6px 2px 2px}
.stin{animation:tiu .3s var(--ease)}
.stc{position:relative;aspect-ratio:1;border-radius:16px;background:var(--s2);display:grid;place-items:center;padding:6px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.stc:active{transform:scale(.9)}
.stc svg,.stc img{width:100%;height:100%;object-fit:contain;display:block}
.stn{color:var(--mu);font-size:12px;border:2px dashed var(--ln);background:none;align-content:center;gap:2px}.stn .i{width:26px;height:26px;margin:0 auto}.stn span{display:block}
.stx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#ef3f55;color:#fff;display:grid;place-items:center;z-index:2}.stx .i{width:14px;height:14px}
.stk{width:150px;height:150px}.stk svg,.stk img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px #0005)}
.m.stm{background:none!important;box-shadow:none!important;padding:0!important;border-radius:0!important}

.m.bge time,.m.me.bge time{color:var(--mu)!important;opacity:1}.m.bge .tk,.m.me.bge .tk{color:var(--mu)!important}
.stb{border-radius:50%;background:var(--s2);flex:none;width:38px;overflow:hidden;transition:width .2s,opacity .15s,margin .2s}
.comp.has .stb{width:0;opacity:0;margin-left:-8px;pointer-events:none}
.dlg.top{z-index:80}
.sted{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);transform:translateY(100%);transition:transform .38s var(--ease)}.sted.in{transform:none}

function getOut(to){if(outs[to])return outs[to];
const p=new Promise((res,rej)=>{const ch=SB.channel('inbox-'+to,{config:{broadcast:{self:false}}});let done=false;
const fail=s=>{if(!done){done=true;rej(new Error(s))}if(outs[to]===p)delete outs[to];try{SB.removeChannel(ch)}catch(e){}};
const tm=setTimeout(()=>{clog('out channel TIMEOUT',to.slice(0,6));fail('TIMEOUT')},8000);
ch.subscribe(s=>{clog('out channel',to.slice(0,6),s);if(s==='SUBSCRIBED'){if(!done){done=true;clearTimeout(tm);res(ch)}}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){clearTimeout(tm);fail(s)}})});
outs[to]=p;p.catch(()=>{});return p}

function makePC(){clog('создаём RTCPeerConnection, серверов:',ICE.iceServers.length);const pc=new RTCPeerConnection(ICE);CL.pc=pc;CL.stream.getTracks().forEach(t=>pc.addTrack(t,CL.stream));

async function onSig(m){const t=m.t;clog('sig ←',t,m.id||'');
if(t==='invite'){if(CL){if(CL.id!==m.id)sig(m.from,{t:'busy',id:m.id});return}
const c=chats.find(x=>x.pid===m.from);
CL={id:m.id,to:m.from,chat:m.chat||c?.id,dir:'in',video:!!m.v,name:c?.name||m.name||'Logos',avatar:c?.avatar_url||m.av||'',state:'ring',q:[],t0:0,muted:false,cam:true};

<div class="arow"><label class="fld"><small>Ник человека</small><input id="aNick" placeholder="@ник" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')admFind()"></label><button class="btn alt" onclick="admFind()">Найти</button></div>
<div class="pl2">Звёзды</div>
<div class="seg" id="aWho"><button data-w="me" class="${WHO==='me'?'on':''}" onclick="admWho('me')">Себе</button><button data-w="tg" class="${WHO==='tg'?'on':''}" onclick="admWho('tg')">Выбранному</button></div>
<label class="fld"><small>Количество звёзд</small><input id="aAmt" type="number" inputmode="numeric" min="1" max="1000000000" placeholder="Например, 1000"></label>
<div class="achips">${[100,1000,10000,100000].map(n=>`<button onclick="admChip(${n})">${nf(n)}</button>`).join('')}</div>
<button class="btn" id="aGive" onclick="admGive(1)">Выдать звёзды</button><button class="btn alt" onclick="admGive(-1)">Списать звёзды</button>
<div class="pl2">Статус</div>
<div class="aR">${B('Галочка',"admDo('verify',true)")}${B('Снять',"admDo('verify',false)")}</div>
<div class="aR">${B('Скам',"admDo('scam',true)")}${B('Не скам',"admDo('scam',false)")}</div>
<div class="aR">${B('Бан','admBanOpen()')}${B('Разбан',"admDo('ban',false)")}</div>
<div class="aR">${B('Закрыть','closeSheet()')}</div></div>`)};
window.admWho=w=>{WHO=w;document.querySelectorAll('#aWho button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));vb(6)};
window.admChip=n=>{const i=$('#aAmt');if(i)i.value=n;vb(6)};
window.admFind=async()=>{const u=($('#aNick').value||'').replace('@','').trim().toLowerCase();if(!u)return;const{data}=await SB.from('profiles').select('id,name').eq('username',u).maybeSingle();if(!data)return toast('Не найден');AT={id:data.id,chat:false,name:data.name};$('#aTg').textContent=data.name;admWho('tg');toast('Цель: '+data.name)};
window.admGive=async sign=>{const raw=parseInt($('#aAmt')?.value,10);if(!raw||raw<1||raw>1e9)return toast('Введите количество от 1 до 1 000 000 000');
let id=me.id,name='себе',self=true;
if(WHO==='tg'){const x=tg();if(!x)return toast('Выберите цель');if(x.chat)return toast('Звёзды можно выдавать только людям');id=x.id;name=x.name;self=id===me.id}
const btn=$('#aGive');if(btn)btn.disabled=true;
const n=sign*raw,r=await SB.rpc('admin_coins',{target_id:id,amount:n});if(btn)btn.disabled=false;
if(r.error)return toast('Не удалось: нет прав');
if(self){prof.coins=Math.max(0,(prof.coins||0)+n);const e=$('#bsMy');if(e)e.textContent=nf(prof.coins);if(tab==='settings')drawList()}
$('#aAmt').value='';vb(14);toast((n>0?'Выдано ':'Списано ')+nf(raw)+' звёзд · '+name)};
window.admBanOpen=()=>{const x=tg();if(!x)return toast('Выберите цель');if(x.chat)return toast('Бан только для людей');if(x.id===me.id)return toast('Нельзя забанить себя');
sheet('Бан пользователя',`<div class="adm"><div class="pl2" style="margin-top:0">Кого баним: <span class="tgt">${esc(x.name)}</span></div>
<label class="fld"><small>Причина бана</small><input id="bnReason" maxlength="200" placeholder="Нарушение правил" onkeydown="if(event.key==='Enter')admBan()"></label>
<button class="btn bad" id="bnGo" onclick="admBan()">Забанить</button><button class="btn alt" onclick="admOpen(true)">Назад</button></div>`);setTimeout(()=>$('#bnReason')?.focus(),380)};
window.admBan=async()=>{const x=tg();if(!x||x.chat||x.id===me.id)return;const reason=($('#bnReason')?.value||'').trim().slice(0,200)||'Нарушение правил';
const b=$('#bnGo');if(b){b.disabled=true;b.textContent='Баним…'}
const r=await SB.rpc('admin_ban',{target_id:x.id,val:true,reason});
if(r.error){if(b){b.disabled=false;b.textContent='Забанить'}return toast(/reason|function|schema|candidate/i.test(r.error.message||'')?'Запустите logos-update12.sql в Supabase':'Не удалось: '+(r.error.message||'нет прав'))}
vb([20,40,20]);closeSheet();toast('Пользователь забанен');await loadChats();drawList()};
window.admDo=async(k,v)=>{const x=tg();if(!x)return toast('Выберите цель');let r;
if(k==='verify')r=await SB.rpc('admin_verify',{target_id:x.id,val:v,is_chat:x.chat});
else if(k==='scam')r=await SB.rpc('admin_scam',{target_id:x.id,val:v,is_chat:x.chat});
else{if(x.chat)return toast('Бан только для людей');r=await SB.rpc('admin_ban',{target_id:x.id,val:v})}
if(r.error)return toast(/function|candidate|schema/i.test(r.error.message||'')?'Запустите logos-update12.sql в Supabase':'Нет прав');
vb(10);toast('Готово');if(x.id===me.id&&k!=='ban'){prof[k==='verify'?'verified':'scam']=v}await loadChats();drawList()};

/* кошелёк */
window.sheetWallet=()=>{sheet('Звёзды',`<div class="wal">${COIN(64)}<b>${nf(prof.coins)}</b><small>звёзд на счёте</small><button class="btn" onclick="buyCoins()">Купить звёзды</button><button class="btn alt" onclick="closeSheet()">Закрыть</button></div>`)};
window.buyCoins=()=>{vb(10);toast('Оплата пока не подключена — скоро появится')};

/* блокировка «на лету» */
const chk=async()=>{try{if(typeof me==='undefined'||!me||document.getElementById('ban'))return;const r=await SB.from('profiles').select('banned,banned_reason').eq('id',me.id).maybeSingle();if(r.data?.banned){prof.banned=true;prof.banned_reason=r.data.banned_reason;banScreen()}}catch(e){}};
setInterval(chk,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
})();
</script>
