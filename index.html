<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logos"><meta name="theme-color" content="#000000">
<title>Logos</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#000}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;transition:opacity .3s}
#load.off{opacity:0;pointer-events:none}
#load b{font-size:28px;letter-spacing:.5px}
#load a{color:#f2f2f2;border:1px solid #444;border-radius:10px;padding:10px 18px;text-decoration:none;display:none}
</style></head><body>
<div id="load"><b>Logos</b><span id="st">Загрузка…</span><a id="open" target="_blank" rel="noopener">Открыть в новой вкладке</a></div>
<iframe id="app" title="Logos"
 allow="camera; microphone; display-capture; clipboard-read; clipboard-write; fullscreen; autoplay; notifications; geolocation"
 allowfullscreen></iframe>
<script>
// === Адрес твоей сборки Cinny (Logos). Замени после деплоя. ===
var CINNY_URL = "https://app.cinny.in/";
// ==============================================================
var f=document.getElementById('app'),l=document.getElementById('load'),o=document.getElementById('open');
o.href=CINNY_URL;
f.addEventListener('load',function(){l.classList.add('off')});
f.src=CINNY_URL;
setTimeout(function(){if(!l.classList.contains('off')){document.getElementById('st').textContent='Долго грузится…';o.style.display='inline-block'}},8000);
</script>
</body></html>
